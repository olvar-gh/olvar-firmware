; olvar-firmware — see docs/PLAN.md §5.4. Every version is pinned exactly.

[platformio]
default_envs = esp32dev
; [secrets] build_flags (OLVAR_DEFAULT_* dev defaults): empty in the committed secrets.defaults.ini,
; overridden by the optional, gitignored secrets.ini (copy secrets.example.ini). A missing secrets.ini
; is fine. Don't define [secrets] here: the main file would win over both extra configs.
extra_configs = secrets.defaults.ini, secrets.ini

[env]
custom_fw_version = 0.1.0
extra_scripts = pre:scripts/version.py
build_flags = -std=gnu++17 -Wall
lib_deps = bblanchon/ArduinoJson @ 7.4.3

[env:esp32dev]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
build_flags =
  ${env.build_flags}
  ${secrets.build_flags}
lib_deps =
  ${env.lib_deps}
  robtillaart/SHT31 @ 0.5.3
  claws/BH1750 @ 1.3.0
  bertmelis/espMqttClient @ 1.7.3
  tzapu/WiFiManager @ 2.0.17
; Embedded tests link src/ so they can exercise the adapters in src/sensors/ etc.
; src/main.cpp is wrapped in #ifndef PIO_UNIT_TESTING so the test's setup()/loop() win.
test_build_src = yes
test_filter = embedded/*

[env:native]
platform = native
test_framework = unity
test_filter = native/*
